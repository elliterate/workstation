- name: macOS Defaults
  hosts: localhost

  vars:
    terminal_profile: Clear Dark

  tasks:
    - block:
      - name: Position dock on bottom of display
        community.general.osx_defaults:
          domain: com.apple.dock
          key: orientation
          type: string
          value: bottom

      - name: Auto-hide dock
        community.general.osx_defaults:
          domain: com.apple.dock
          key: autohide
          type: bool
          value: true

      - name: Configure dock tile size
        community.general.osx_defaults:
          domain: com.apple.dock
          key: tilesize
          type: int
          value: 65

      - name: Disable dock icon magnification
        community.general.osx_defaults:
          domain: com.apple.dock
          key: magnification
          type: bool
          value: false

      - name: New Finder window defaults to home folder
        community.general.osx_defaults:
          domain: com.apple.finder
          key: NewWindowTarget
          type: string
          value: PfHm

      - name: Use function keys as function keys
        community.general.osx_defaults:
          domain: NSGlobalDomain
          key: com.apple.keyboard.fnState
          type: bool
          value: true

      - name: Enable full keyboard access for all controls
        community.general.osx_defaults:
          domain: NSGlobalDomain
          key: AppleKeyboardUIMode
          type: int
          value: 3

      - name: Set fastest key repeat
        community.general.osx_defaults:
          domain: NSGlobalDomain
          key: KeyRepeat
          type: int
          value: 1 # lower is faster

      - name: Set shortest initial key repeat delay
        community.general.osx_defaults:
          domain: NSGlobalDomain
          key: InitialKeyRepeat
          type: int
          value: 15 # lower is shorter

      - name: Don't automatically correct spelling
        community.general.osx_defaults:
          domain: NSGlobalDomain
          key: NSAutomaticSpellingCorrectionEnabled
          type: bool
          value: false

      - name: Don't automatically capitalize
        community.general.osx_defaults:
          domain: NSGlobalDomain
          key: NSAutomaticCapitalizationEnabled
          type: bool
          value: false

      - name: Don't automatically substitute dashes
        community.general.osx_defaults:
          domain: NSGlobalDomain
          key: NSAutomaticDashSubstitutionEnabled
          type: bool
          value: false

      - name: Don't automatically substitute periods
        community.general.osx_defaults:
          domain: NSGlobalDomain
          key: NSAutomaticPeriodSubstitutionEnabled
          type: bool
          value: false

      - name: Don't automatically substitute quotes
        community.general.osx_defaults:
          domain: NSGlobalDomain
          key: NSAutomaticQuoteSubstitutionEnabled
          type: bool
          value: false

      - name: Set tap behavior to "click"
        community.general.osx_defaults:
          domain: NSGlobalDomain
          key: com.apple.mouse.tapBehavior
          type: int
          value: 1

      - name: Enable built-in trackpad tap-to-click
        community.general.osx_defaults:
          domain: com.apple.AppleMultitouchTrackpad
          key: Clicking
          type: int
          value: 1

      - name: Enable external trackpad tap-to-click
        community.general.osx_defaults:
          domain: com.apple.driver.AppleBluetoothMultitouch.trackpad
          key: Clicking
          type: int
          value: 1

      - name: Enable scroll gesture with modifier keys to zoom
        community.general.osx_defaults:
          domain: com.apple.universalaccess
          key: closeViewScrollWheelToggle
          type: bool
          value: true

      - name: Disable swipe navigation
        community.general.osx_defaults:
          domain: NSGlobalDomain
          key: AppleEnableSwipeNavigateWithScrolls
          type: bool
          value: false

      - name: Disable conflicting default keyboard shortcuts
        shell: |
          read -r -d '' DISABLED_KEYBOARD_SHORTCUT_XML <<-XML
            <dict>
              <key>enabled_context_menu</key>
              <false/>
              <key>enabled_services_menu</key>
              <false/>
              <key>presentation_modes</key>
              <dict>
                <key>ContextMenu</key>
                <false/>
                <key>ServicesMenu</key>
                <false/>
              </dict>
            </dict>
          XML

          # CMD-SHIFT-L
          defaults write pbs NSServicesStatus -dict-add "com.apple.Safari - Search With %WebSearchProvider@ - searchWithWebSearchProvider" "$DISABLED_KEYBOARD_SHORTCUT_XML"

          # CMD-SHIFT-A
          defaults write pbs NSServicesStatus -dict-add "com.apple.Terminal - Search man Page Index in Terminal - searchManPages" "$DISABLED_KEYBOARD_SHORTCUT_XML"

      - name: Always show tab bar in Safari
        community.general.osx_defaults:
          domain: com.apple.Safari
          key: AlwaysShowTabBar
          type: bool
          value: true

      - name: Don't autofill credit cards in Safari
        community.general.osx_defaults:
          domain: com.apple.Safari
          key: AutoFillCreditCardData
          type: bool
          value: false

      - name: Don't autofill passwords in Safari
        community.general.osx_defaults:
          domain: com.apple.Safari
          key: AutoFillPasswords
          type: bool
          value: false

      - name: Don't auto-open safe downloads in Safari
        community.general.osx_defaults:
          domain: com.apple.Safari
          key: AutoOpenSafeDownloads
          type: bool
          value: false

      - name: Don't show site color in tab bar in Safari
        community.general.osx_defaults:
          domain: com.apple.Safari
          key: NeverUseBackgroundColorInToolbar
          type: bool
          value: true

      - name: Show Developer menu in Safari
        community.general.osx_defaults:
          domain: com.apple.Safari
          key: IncludeDevelopMenu
          type: bool
          value: true

      - name: Set default Terminal profile
        community.general.osx_defaults:
          domain: com.apple.Terminal
          key: Default Window Settings
          type: string
          value: "{{ terminal_profile }}"

      - name: Disable audible bell in Terminal
        shell: |
          plutil -replace "Window Settings"."{{ terminal_profile }}".Bell -integer 0 ~/Library/Preferences/com.apple.Terminal.plist

      - name: Disable visual bell in Terminal
        shell: |
          plutil -replace "Window Settings"."{{ terminal_profile }}".VisualBell -integer 0 ~/Library/Preferences/com.apple.Terminal.plist

      - name: Close window if shell exited cleanly in Terminal
        shell: |
          plutil -replace "Window Settings"."{{ terminal_profile }}".shellExitAction -integer 1 ~/Library/Preferences/com.apple.Terminal.plist

      - name: Ask for password when screen is locked
        community.general.osx_defaults:
          domain: com.apple.screensaver
          key: askForPassword
          type: int
          value: 1

      - name: Ask for password immediately
        community.general.osx_defaults:
          domain: com.apple.screensaver
          key: askForPasswordDelay
          type: float
          value: 0

      - name: Disable rich text in new TextEdit documents
        community.general.osx_defaults:
          domain: com.apple.TextEdit
          key: RichText
          type: bool
          value: false

      - name: Disable text replacement in new TextEdit documents
        community.general.osx_defaults:
          domain: com.apple.TextEdit
          key: TextReplacement
          type: bool
          value: false

      - name: Set global Zoom "Toggle Audio" shortcut to CTRL-OPT-CMD-A
        community.general.osx_defaults:
          domain: us.zoom.xos.HotKey
          key: "[HK@combo]-HotkeyOnOffAudio"
          type: dict
          value:
            "hot key code": 0
            "hot key modifier": 1835008

      - name: Set global Zoom "Toggle Video" shortcut to CTRL-OPT-CMD-V
        community.general.osx_defaults:
          domain: us.zoom.xos.HotKey
          key: "[HK@combo]-HotkeyOnOffVideo"
          type: dict
          value:
            "hot key code": 9
            "hot key modifier": 1835008

      - name: Set left half shortcut in Rectangle
        community.general.osx_defaults:
          domain: com.knollsoft.Rectangle
          key: leftHalf
          type: dict
          value:
            keyCode: 123 # LEFT
            modifierFlags: 1835008 # CTRL-OPT-CMD

      - name: Set right half shortcut in Rectangle
        community.general.osx_defaults:
          domain: com.knollsoft.Rectangle
          key: rightHalf
          type: dict
          value:
            keyCode: 124 # RIGHT
            modifierFlags: 1835008 # CTRL-OPT-CMD

      - name: Set top half shortcut in Rectangle
        community.general.osx_defaults:
          domain: com.knollsoft.Rectangle
          key: topHalf
          type: dict
          value:
            keyCode: 126 # UP
            modifierFlags: 1835008 # CTRL-OPT-CMD

      - name: Set bottom half shortcut in Rectangle
        community.general.osx_defaults:
          domain: com.knollsoft.Rectangle
          key: bottomHalf
          type: dict
          value:
            keyCode: 125 # DOWN
            modifierFlags: 1835008 # CTRL-OPT-CMD

      - name: Set maximize shortcut in Rectangle
        community.general.osx_defaults:
          domain: com.knollsoft.Rectangle
          key: maximize
          type: dict
          value:
            keyCode: 46 # M
            modifierFlags: 1835008 # CTRL-OPT-CMD

      - name: Set next display shortcut in Rectangle
        community.general.osx_defaults:
          domain: com.knollsoft.Rectangle
          key: nextDisplay
          type: dict
          value:
            keyCode: 124 # RIGHT
            modifierFlags: 786432 # CTRL-OPT

      - name: Set previous display shortcut in Rectangle
        community.general.osx_defaults:
          domain: com.knollsoft.Rectangle
          key: previousDisplay
          type: dict
          value:
            keyCode: 123 # LEFT
            modifierFlags: 786432 # CTRL-OPT

      - name: Dim all windows without focus in HazeOver
        community.general.osx_defaults:
          domain: com.pointum.hazeover
          key: IndependentScreens
          type: bool
          value: false

      - name: Set animation duration in HazeOver
        community.general.osx_defaults:
          domain: com.pointum.hazeover
          key: Animation
          type: float
          value: "0.05"

      when: ansible_facts['os_family'] == "Darwin"
